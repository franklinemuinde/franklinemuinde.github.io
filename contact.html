<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frankline Muinde — Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #181c26;
    --border: rgba(255,255,255,0.07);
    --border-focus: rgba(200,169,110,0.5);
    --text: #e8e4dc;
    --muted: rgba(232,228,220,0.45);
    --accent: #c8a96e;
    --accent-dim: rgba(200,169,110,0.1);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-y: auto;
    cursor: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 88px 24px 32px;
  }

  /* Custom cursor */
  .cursor {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease;
  }
  .cursor-ring {
    width: 32px; height: 32px;
    border: 1px solid rgba(200,169,110,0.4);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: border-color 0.2s ease;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1; opacity: 0.5;
  }

  /* Grid lines background */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none; z-index: 0;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  }

  /* Nav */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 48px;
    border-bottom: 1px solid var(--border);
    background: rgba(13,15,20,0.75);
    backdrop-filter: blur(12px);
  }

  .nav-logo {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
  }

  .nav-links a {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.25s;
    position: relative;
  }

  .nav-links a.active { color: var(--accent); }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -3px; left: 0;
    width: 0; height: 1px;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .nav-links a:hover { color: var(--text); }
  .nav-links a.active::after,
  .nav-links a:hover::after { width: 100%; }

  /* ── BACKDROP ── */
  .backdrop {
    position: fixed; inset: 0;
    z-index: 2;
    background: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(200,169,110,0.04) 0%, transparent 70%);
  }

  /* ── FLOATING MODAL ── */
  .modal {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 680px;
    margin: 0 24px;
    background: var(--surface);
    border: 1px solid rgba(200,169,110,0.18);
    box-shadow:
      0 0 0 1px rgba(200,169,110,0.06),
      0 32px 80px rgba(0,0,0,0.6),
      0 0 120px rgba(200,169,110,0.04);
    opacity: 0;
    transform: translateY(28px);
    animation: floatIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
  }

  /* Corner accents */
  .modal::before,
  .modal::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
  }
  .modal::before {
    top: -1px; left: -1px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
  }
  .modal::after {
    bottom: -1px; right: -1px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }

  /* ── MODAL HEADER ── */
  .modal-header {
    padding: 24px 36px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .modal-header-left { display: flex; flex-direction: column; gap: 8px; }

  .modal-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .modal-eyebrow::before { content: '// '; opacity: 0.5; }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .modal-title em {
    font-style: italic;
    color: var(--accent);
    font-weight: 400;
  }

  /* Close button */
  .close-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    background: none;
    cursor: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 18px;
    transition: all 0.25s;
    text-decoration: none;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .close-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── FORM BODY ── */
  .modal-body {
    padding: 20px 36px 16px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.2s;
  }

  .form-group:focus-within label { color: var(--accent); }

  input, textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    padding: 14px 18px;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    resize: none;
    width: 100%;
    cursor: none;
  }

  input::placeholder, textarea::placeholder {
    color: rgba(232,228,220,0.18);
    font-size: 13px;
  }

  input:focus, textarea:focus {
    border-color: var(--border-focus);
    background: rgba(200,169,110,0.03);
    box-shadow: 0 0 0 3px rgba(200,169,110,0.06);
  }

  textarea {
    height: 120px;
    line-height: 1.7;
  }

  /* ── MODAL FOOTER ── */
  .modal-footer {
    padding: 0 36px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Social icons */
  .socials {
    display: flex;
    gap: 12px;
  }

  .social-icon {
    width: 38px; height: 38px;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    color: var(--muted);
    transition: all 0.25s;
    cursor: none;
  }

  .social-icon:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .social-icon svg {
    width: 15px; height: 15px;
    fill: currentColor;
  }

  /* Send button */
  .btn-send {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 32px;
    background: var(--accent);
    color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border: none;
    cursor: none;
    position: relative;
    overflow: hidden;
    transition: opacity 0.25s;
  }

  .btn-send::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.15);
    transform: translateX(-100%);
    transition: transform 0.3s ease;
  }

  .btn-send:hover::after { transform: translateX(0); }

  .btn-send svg {
    width: 13px; height: 13px;
    fill: var(--bg);
    transition: transform 0.3s ease;
  }

  .btn-send:hover svg { transform: translateX(3px); }

  /* Success state */
  .success-overlay {
    display: none;
    position: absolute; inset: 0;
    background: var(--surface);
    z-index: 20;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 48px;
  }

  .success-overlay.show { display: flex; }

  .success-icon {
    width: 56px; height: 56px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    color: var(--accent);
    animation: pulse 2s ease infinite;
  }

  .success-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
  }

  .success-title em { font-style: italic; color: var(--accent); font-weight: 400; }

  .success-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 320px;
  }

  /* Animations */
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0.3); }
    50%       { box-shadow: 0 0 0 10px rgba(200,169,110,0); }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent); }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <a href="index.html" class="nav-logo">FM.portfolio</a>
  <ul class="nav-links">
    <li><a href="intro.html">Intro</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
    <li><a href="resume.pdf">Resume</a></li>
  </ul>
</nav>

<div class="backdrop"></div>

<!-- FLOATING MODAL -->
<div class="modal" id="modal">

  <!-- Success overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-icon">✓</div>
    <h2 class="success-title">Message <em>Sent.</em></h2>
    <p class="success-desc">Thanks for reaching out, Frankline will get back to you shortly.</p>
    <a href="index.html" class="btn-send" style="margin-top:8px;">
      Back to home
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>

  <!-- HEADER -->
  <div class="modal-header">
    <div class="modal-header-left">
      <div class="modal-eyebrow">Get in touch</div>
      <h1 class="modal-title">Let's <em>Talk.</em></h1>
    </div>
    <a href="index.html" class="close-btn" title="Back to home">✕</a>
  </div>

  <!-- FORM -->
  <div class="modal-body">
    <form id="contactForm" action="https://formspree.io/f/mkovqygq" method="POST">>
      <div class="form-row">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="What's this about?">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell me about your project, opportunity, or just say hello..." required></textarea>
        </div>
      </div>
    </form>
  </div>

  <!-- FOOTER -->
  <div class="modal-footer">
    <div class="socials">
      <!-- GitHub -->
      <a href="https://github.com/franklinemuinde" class="social-icon" title="GitHub">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
          <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/frankline-muinde" class="social-icon" title="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
          <!-- Twitter / X -->
      <a href="#" class="social-icon" title="Twitter">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>
      </a>
    </div>

    <button class="btn-send" id="sendBtn" type="button">
      Send Message
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>

</div><!-- end .modal -->

<script>
  // Custom cursor
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px';
    cursor.style.top = my + 'px';
  });

  function animateRing() {
    rx += (mx - rx) * 0.12;
    ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';
    requestAnimationFrame(animateRing);
  }
  animateRing();

  document.querySelectorAll('a, button, input, textarea').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursor.style.transform = 'translate(-50%, -50%) scale(2)';
      ring.style.borderColor = 'rgba(200,169,110,0.7)';
    });
    el.addEventListener('mouseleave', () => {
      cursor.style.transform = 'translate(-50%, -50%) scale(1)';
      ring.style.borderColor = 'rgba(200,169,110,0.4)';
    });
  });

  // Form submit
  document.getElementById('sendBtn').addEventListener('click', () => {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!name || !email || !message) {
      // Shake empty required fields
      [document.getElementById('name'), document.getElementById('email'), document.getElementById('message')].forEach(el => {
        if (!el.value.trim()) {
          el.style.borderColor = 'rgba(200,100,100,0.6)';
          el.style.animation = 'none';
          setTimeout(() => { el.style.borderColor = ''; }, 1200);
        }
      });
      return;
    }

    // Show success
    document.getElementById('successOverlay').classList.add('show');
  });
</script>
</body>
</html>
