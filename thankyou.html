<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frankline Muinde — Message Sent</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14; --surface: #13161e;
    --border: rgba(255,255,255,0.07);
    --text: #e8e4dc; --muted: rgba(232,228,220,0.45);
    --accent: #c8a96e; --accent-dim: rgba(200,169,110,0.1);
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif; font-weight: 300;
    min-height: 100vh; cursor: none;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .cursor { width:8px; height:8px; background:var(--accent); border-radius:50%; position:fixed; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); }
  .cursor-ring { width:32px; height:32px; border:1px solid rgba(200,169,110,0.4); border-radius:50%; position:fixed; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); }
  body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:1; opacity:0.5; }
  body::after { content:''; position:fixed; inset:0; background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px); background-size:80px 80px; pointer-events:none; z-index:0; mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%); }

  nav { position:fixed; top:0; left:0; right:0; z-index:200; display:flex; justify-content:space-between; align-items:center; padding:24px 48px; border-bottom:1px solid var(--border); background:rgba(13,15,20,0.75); backdrop-filter:blur(12px); }
  .nav-logo { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.2em; color:var(--accent); text-transform:uppercase; text-decoration:none; }
  .nav-links { display:flex; gap:40px; list-style:none; }
  .nav-links a { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); text-decoration:none; transition:color 0.25s; }
  .nav-links a:hover { color:var(--text); }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 480px;
    margin: 0 24px;
    background: var(--surface);
    border: 1px solid rgba(200,169,110,0.18);
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 120px rgba(200,169,110,0.04);
    padding: 56px 48px;
    text-align: center;
    opacity: 0;
    transform: translateY(24px);
    animation: floatIn 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
  }

  /* Corner accents */
  .card::before, .card::after { content:''; position:absolute; width:20px; height:20px; }
  .card::before { top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); }
  .card::after { bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); }

  .success-icon {
    width: 60px; height: 60px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--accent);
    margin: 0 auto 28px;
    animation: pulse 2s ease infinite;
  }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 16px;
  }
  .eyebrow::before { content: '// '; opacity: 0.5; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 36px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.1;
    margin-bottom: 16px;
  }
  h1 em { font-style: italic; color: var(--accent); font-weight: 400; }

  p {
    font-size: 14px; line-height: 1.8;
    color: var(--muted); margin-bottom: 36px;
  }

  .btn-home {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 32px;
    background: var(--accent); color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: 0.22em;
    text-transform: uppercase; text-decoration: none;
    cursor: none; position: relative; overflow: hidden;
    transition: opacity 0.25s;
    margin-right: 12px;
  }
  .btn-home::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0.15); transform:translateX(-100%); transition:transform 0.3s ease; }
  .btn-home:hover::after { transform:translateX(0); }

  .btn-back {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 32px;
    border: 1px solid var(--border); color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 9px; letter-spacing: 0.22em;
    text-transform: uppercase; text-decoration: none;
    cursor: none; transition: all 0.25s;
  }
  .btn-back:hover { border-color: var(--accent); color: var(--accent); }

  @keyframes floatIn { from{opacity:0;transform:translateY(24px);} to{opacity:1;transform:translateY(0);} }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(200,169,110,0.3);} 50%{box-shadow:0 0 0 10px rgba(200,169,110,0);} }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <a href="index.html" class="nav-logo">FM.portfolio</a>
  <ul class="nav-links">
    <li><a href="intro.html">Intro</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="resume.pdf">Resume</a></li>
  </ul>
</nav>

<div class="card">
  <div class="success-icon">✓</div>
  <div class="eyebrow">Success</div>
  <h1>Message <em>Sent.</em></h1>
  <p>Thanks for reaching out! I'll get back to you as soon as possible.</p>
  <div>
    <a href="index.html" class="btn-home">Back to Home</a>
    <a href="projects.html" class="btn-back">View Projects</a>
  </div>
</div>

<script>
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx=0, my=0, rx=0, ry=0;
  document.addEventListener('mousemove', e => {
    mx=e.clientX; my=e.clientY;
    cursor.style.left=mx+'px'; cursor.style.top=my+'px';
  });
  function animateRing() {
    rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(animateRing);
  }
  animateRing();
  document.querySelectorAll('a').forEach(el => {
    el.addEventListener('mouseenter', () => { cursor.style.transform='translate(-50%,-50%) scale(2)'; ring.style.borderColor='rgba(200,169,110,0.7)'; });
    el.addEventListener('mouseleave', () => { cursor.style.transform='translate(-50%,-50%) scale(1)'; ring.style.borderColor='rgba(200,169,110,0.4)'; });
  });
</script>
</body>
</html>
